id: io.github.ErnieBernie10.RDPilot

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

command: rdpilot

build-options:
  # Must be prepend, not append. The dotnet module's install.sh creates /app/bin/dotnet,
  # which is the runtime-only copy with no sdk/ directory. With append, /app/bin wins on
  # PATH and `dotnet publish` fails with "No .NET SDKs were found".
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig

finish-args:
  # Avalonia/Skia need a GPU device and a display socket.
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # RDP sessions and optional RDP gateway.
  - --share=network
  # Fallback leg only; the portal is the live path. Inside a sandbox libsecret's
  # backend_get_impl_type() selects its `file` backend whenever /.flatpak-info exists and
  # org.freedesktop.portal.Secret answers a version query -- it then takes a per-app master
  # key from that portal and encrypts its own $XDG_DATA_HOME/keyrings/default.keyring, never
  # contacting org.freedesktop.secrets. secret-tool's store/lookup/clear all route through
  # secret_backend_get(), so all three of SecretStore.cs's calls follow that path.
  #
  # Where no org.freedesktop.impl.portal.Secret backend exists (Plasma older than the
  # KWallet ksecretd portal bridge, KeePassXC as the Secret Service provider, bare WMs) the
  # version check fails and libsecret falls back to the D-Bus Secret Service, which this
  # permission gates. SecretStore.cs deliberately does not degrade to plaintext, so without
  # it password storage hard-fails on those desktops.
  - --talk-name=org.freedesktop.secrets
  # Framework-dependent publish; the runtime is installed by the dotnet module below.
  - --env=DOTNET_ROOT=/app/lib/dotnet

# No add-extensions block for codecs here on purpose. org.freedesktop.Platform ships ffmpeg
# built with --disable-decoder="h264,hevc,vc1,vvc", so H.264 RDPGFX only decodes when the
# extra codec extension is installed -- but the Platform already declares that extension
# point itself:
#
#   Extension org.freedesktop.Platform.codecs-extra:
#     directory: '%{lib}/codecs-extra'
#     version: "%{branch-extra}"
#     add-ld-path: lib
#
# so the app does not declare one. Users install it with:
#
#   flatpak install flathub org.freedesktop.Platform.codecs-extra//25.08-extra
#
# Note the branch is 25.08-extra, not 25.08. In freedesktop-sdk 24.08 and earlier this
# extension was called org.freedesktop.Platform.ffmpeg-full; it was renamed in 25.08.

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # ---------------------------------------------------------------- .NET runtime
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  # ---------------------------------------------------------------- secret-tool
  # RDPilot.Client/Services/SecretStore.cs shells out to secret-tool on Linux and refuses to
  # fall back to plaintext, so the binary has to exist inside the sandbox.
  - name: libsecret
    buildsystem: meson
    # Option names are from libsecret 0.21.7 meson.options. There is no `tests` option, and
    # the crypto backend option is `crypto` (default libgcrypt, which the SDK provides), not
    # `gcrypt`. `gtk_doc` and `manpage` are off to avoid needing gi-docgen and xsltproc.
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dbash_completion=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: '0.21.7'
        commit: 22d58b2cd018b9beaab46fcc31cc552fa05afc2b
    cleanup:
      - /share/gir-1.0
      - /share/vala

  # ---------------------------------------------------------------- FreeRDP 3
  - name: cjson
    buildsystem: cmake-ninja
    # flatpak-builder configures cmake modules in-source unless this is set.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_CJSON_TEST=OFF
      - -DBUILD_SHARED_AND_STATIC_LIBS=OFF
      # cJSON still declares cmake_minimum_required(VERSION 3.0) and the SDK ships CMake 4,
      # which removed compatibility below 3.5. FreeRDP (3.13) and RDPilot.Wrapper (3.15) are
      # unaffected.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.19
        commit: c859b25da02955fef659d658b8f324b5cde87be3

  # Only the libraries RDPilot.Wrapper links against: libfreerdp3, libfreerdp-client3 and
  # libwinpr3. No SDL/X11 client, no server, no smartcard/kerberos stack.
  - name: freerdp
    buildsystem: cmake-ninja
    # FreeRDP's cmake/PreventInSourceBuilds.cmake aborts without this.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_CLIENT_COMMON=ON
      - -DWITH_CLIENT_CHANNELS=ON
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_CLIENT_SDL3=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_WINPR_TOOLS=OFF
      # Enables WITH_GFX_H264; the decoder itself comes from the codecs-extra extension.
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_PULSE=OFF
      - -DWITH_ALSA=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_AAD=OFF
      - -DWITH_WEBVIEW=OFF
      - -DWITH_URIPARSER=OFF
      # Options below default to a computed variable rather than a literal, so they switch
      # themselves on and then hard-require a dependency. WITH_FUSE is the one that matters:
      # it defaults ON everywhere except Apple/Windows/Android and does
      # `pkg_check_modules(FUSE3 REQUIRED ... fuse3)`. It only powers remote-to-local
      # clipboard file paste, which RDPilot does not implement.
      - -DWITH_FUSE=OFF
      - -DWITH_OPUS=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_FDK_AAC=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_OPENCL=OFF
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: '3.30.0'
        commit: cc741756e3a07fe1e5f4661a59b2e4e85f1a148f
    cleanup:
      - /bin

  # ---------------------------------------------------------------- RDPilot
  - name: rdpilot
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
    # Publish, then install the payload, launcher, desktop entry, metainfo, icons and
    # LICENSE. Invoked with `sh` so the step does not depend on the source file's mode bit.
    build-commands:
      - sh build.sh
    sources:
      # Keep tag, commit, VERSION in build.sh, and the newest <release> in the metainfo in
      # sync. See "Releasing" in packaging/flatpak/README.md.
      - type: git
        url: https://github.com/ErnieBernie10/RDPilot.git
        tag: v1.3.0
        commit: 4f751c41a681488dc1a44c8589d62bad08f25573
      - type: file
        path: build.sh
      - type: file
        path: rdpilot.sh
      - type: file
        path: io.github.ErnieBernie10.RDPilot.desktop
      - type: file
        path: io.github.ErnieBernie10.RDPilot.metainfo.xml
      - nuget-sources.json
