id: io.github.ErnieBernie10.RDPilot

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

command: rdpilot

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig

finish-args:
  # Avalonia/Skia need a GPU device and a display socket.
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # RDP sessions and optional RDP gateway.
  - --share=network
  # SecretStore stores connection passwords through secret-tool.
  - --talk-name=org.freedesktop.secrets
  # Framework-dependent publish; the runtime is installed by the dotnet module below.
  - --env=DOTNET_ROOT=/app/lib/dotnet

# org.freedesktop.Platform ships ffmpeg without the patent-encumbered decoders, so H.264
# RDPGFX streams only decode when the full build is mounted here.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    autodelete: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # ---------------------------------------------------------------- .NET runtime
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  # ---------------------------------------------------------------- secret-tool
  # RDPilot.Client/Services/SecretStore.cs shells out to secret-tool on Linux and refuses to
  # fall back to plaintext, so the binary has to exist inside the sandbox.
  - name: libsecret
    buildsystem: meson
    # Option names are from libsecret 0.21.7 meson.options. There is no `tests` option, and
    # the crypto backend option is `crypto` (default libgcrypt, which the SDK provides), not
    # `gcrypt`. `gtk_doc` and `manpage` are off to avoid needing gi-docgen and xsltproc.
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dbash_completion=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: '0.21.7'
        commit: 22d58b2cd018b9beaab46fcc31cc552fa05afc2b
    cleanup:
      - /share/gir-1.0
      - /share/vala

  # ---------------------------------------------------------------- FreeRDP 3
  - name: cjson
    buildsystem: cmake-ninja
    # flatpak-builder configures cmake modules in-source unless this is set.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_CJSON_TEST=OFF
      - -DBUILD_SHARED_AND_STATIC_LIBS=OFF
      # cJSON still declares cmake_minimum_required(VERSION 3.0) and the SDK ships CMake 4,
      # which removed compatibility below 3.5. FreeRDP (3.13) and RDPilot.Wrapper (3.15) are
      # unaffected.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.19
        commit: c859b25da02955fef659d658b8f324b5cde87be3

  # Only the libraries RDPilot.Wrapper links against: libfreerdp3, libfreerdp-client3 and
  # libwinpr3. No SDL/X11 client, no server, no smartcard/kerberos stack.
  - name: freerdp
    buildsystem: cmake-ninja
    # FreeRDP's cmake/PreventInSourceBuilds.cmake aborts without this.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_CLIENT_COMMON=ON
      - -DWITH_CLIENT_CHANNELS=ON
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_CLIENT_SDL3=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_WINPR_TOOLS=OFF
      # Enables WITH_GFX_H264; the decoder itself comes from the ffmpeg-full extension.
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_PULSE=OFF
      - -DWITH_ALSA=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_AAD=OFF
      - -DWITH_WEBVIEW=OFF
      - -DWITH_URIPARSER=OFF
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: '3.30.0'
        commit: cc741756e3a07fe1e5f4661a59b2e4e85f1a148f
    cleanup:
      - /bin

  # ---------------------------------------------------------------- RDPilot
  - name: rdpilot
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      # The checked-in NuGet.config points at nuget.org and the Avalonia feed; neither is
      # reachable during a Flatpak build. Everything is restored from ./nuget-sources.
      - rm -f NuGet.config
      - |
        dotnet publish RDPilot.Client/RDPilot.Client.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained false \
          --source ./nuget-sources \
          --source /usr/lib/sdk/dotnet10/nuget/packages \
          -p:Version=1.3.0 \
          -p:AssemblyVersion=1.3.0.0 \
          -p:FileVersion=1.3.0.0 \
          -p:InformationalVersion=1.3.0 \
          -p:NativeWrapperUseVcpkg=false
      # RDPilot.Client.csproj (CopyNativeWrapperToPublish) already dropped
      # libfreerdp_wrapper.so into the publish directory next to the managed assembly.
      - install -d ${FLATPAK_DEST}/lib/rdpilot
      - cp -a RDPilot.Client/bin/Release/net10.0/linux-x64/publish/. ${FLATPAK_DEST}/lib/rdpilot/
      - install -Dm755 rdpilot.sh ${FLATPAK_DEST}/bin/rdpilot

      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 RDPilot.Client/Assets/rdpilot-app-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 RDPilot.Client/Assets/rdpilot-app-icon-256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE

      # Mount point for the ffmpeg-full extension declared above.
      - install -d ${FLATPAK_DEST}/lib/ffmpeg
    sources:
      # Before submitting to Flathub, tag this commit and add the matching `tag:` line. The
      # version passed to dotnet publish and the newest <release> in the metainfo must agree.
      - type: git
        url: https://github.com/ErnieBernie10/RDPilot.git
        commit: 33517737969afd1f37914a36d05ee8d3a1acb053
      - type: file
        path: rdpilot.sh
      - type: file
        path: io.github.ErnieBernie10.RDPilot.desktop
      - type: file
        path: io.github.ErnieBernie10.RDPilot.metainfo.xml
      - nuget-sources.json
