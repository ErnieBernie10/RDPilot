name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version to stamp into the installer
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      INSTALLER_PATH: artifacts\installer\RDPilot.Client-Setup-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a valid package version. Use a tag like v0.1.0 or pass 0.1.0 manually."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Setup vcpkg dependencies
        shell: pwsh
        run: scripts/setup-windows-vcpkg.ps1 -VcpkgRoot $env:VCPKG_ROOT

      - name: Test
        shell: pwsh
        run: dotnet test RDPilot.slnx -c Release

      - name: Build installer
        shell: pwsh
        run: scripts/build-installer-windows.ps1 -VcpkgRoot $env:VCPKG_ROOT -AppVersion '${{ steps.version.outputs.version }}'

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:INSTALLER_PATH -Algorithm SHA256).Hash
          $hashFile = "$env:INSTALLER_PATH.sha256"
          $hash | Out-File -FilePath $hashFile -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Installer SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPilot.Client-Setup-win-x64-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/RDPilot.Client-Setup-win-x64.exe
            artifacts/installer/RDPilot.Client-Setup-win-x64.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/RDPilot.Client-Setup-win-x64.exe
            artifacts/installer/RDPilot.Client-Setup-win-x64.exe.sha256
          body: |
            Windows x64 installer for RDPilot ${{ steps.version.outputs.version }}.

            SHA256: `${{ steps.hash.outputs.sha256 }}`
