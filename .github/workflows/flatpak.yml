name: Flatpak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: RDPilot.flatpak
          manifest-path: packaging/flatpak/io.github.ErnieBernie10.RDPilot.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          mirror-screenshots-url: https://dl.flathub.org/media/
          verbose: true

      # Flathub treats linter warnings as fatal, so mirror that here rather than finding out
      # during review.
      - name: Lint manifest
        run: |
          flatpak-builder-lint manifest packaging/flatpak/io.github.ErnieBernie10.RDPilot.yaml

      # Two checks cannot pass outside Flathub's own pipeline. They assert that screenshot
      # and icon URLs in the composed catalogue start with https://dl.flathub.org/media --
      # a prefix check, not a reachability one. Flathub gets that by running flatpak-builder
      # with --compose-url-policy=full, which makes appstreamcli rewrite the URLs; the
      # GitHub Action exposes no input for that flag. They are also documented as
      # never-granted exceptions, so they cannot be waived with --exceptions either.
      #
      # Filter exactly those two and fail on anything else, so the rest of the lint (metainfo
      # validation, icon presence, desktop file, finish-args) still gates the build. A broken
      # screenshot URL surfaces as appstream-missing-screenshots, which is not filtered.
      - name: Lint build directory
        run: |
          flatpak-builder-lint builddir flatpak_app > lint.json || true
          cat lint.json
          python3 -c "
          import json, sys
          infra_only = {
              'appstream-external-screenshot-url',
              'appstream-remote-icon-not-mirrored',
          }
          errors = set(json.load(open('lint.json')).get('errors', []))
          remaining = sorted(errors - infra_only)
          if remaining:
              print('Actionable lint errors: ' + ', '.join(remaining))
              sys.exit(1)
          print('No actionable lint errors.')
          "

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RDPilot.flatpak
