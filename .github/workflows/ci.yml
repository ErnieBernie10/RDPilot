name: CI

on:
  pull_request:
  # Feature branches are covered by pull_request; pushing there too built every PR commit twice.
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            cmake \
            dotnet-sdk \
            freerdp \
            git \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build RDPilot.slnx --configuration Release

      - name: Test
        run: dotnet test RDPilot.slnx --configuration Release --no-build
