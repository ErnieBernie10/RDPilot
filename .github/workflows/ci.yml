name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            cmake \
            dotnet-sdk \
            freerdp \
            gcc \
            git \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build RDPilot.slnx --configuration Release

      - name: Test
        run: dotnet test RDPilot.slnx --configuration Release --no-build
