name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            cmake \
            dotnet-sdk \
            freerdp \
            git \
            openssl \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build RDPilot.slnx --configuration Release

      - name: Test
        run: dotnet test RDPilot.slnx --configuration Release --no-build

      - name: Wrapper end-to-end tests
        run: |
          cmake -S RDPilot.Wrapper -B build-e2e -DRDPILOT_BUILD_E2E_TESTS=ON
          cmake --build build-e2e
          ctest --test-dir build-e2e --output-on-failure
